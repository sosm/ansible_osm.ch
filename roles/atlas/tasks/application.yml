- name: Clone stop_sync_osm_atlas code
  ansible.builtin.git:
    repo: "{{ atlas__repo }}"
    dest: "{{ atlas__basedir }}/stop_sync_osm_atlas"
    version: "{{ atlas__version | default('main') }}"
  become: true
  become_user: "{{ atlas__user }}"
  notify:
    - atlas flask db upgrade
    - restart atlas gunicorn

- name: Read engine.ref from the stop_sync_osm_atlas repository
  ansible.builtin.slurp:
    src: "{{ atlas__basedir }}/stop_sync_osm_atlas/engine.ref"
  register: engine_ref_raw

- name: Derive the git version (strip trailing newline/whitespace)
  ansible.builtin.set_fact:
    engine_git_ref: "{{ (engine_ref_raw.content | b64decode) | trim }}"

- name: Clone engine code {{ engine_git_ref[:8] }}
  ansible.builtin.git:
    repo: https://github.com/openTdataCH/osm-public-transport-matcher.git
    dest: "{{ atlas__basedir }}/osm-public-transport-matcher"
    version: "{{ engine_git_ref }}"
  become: true
  become_user: "{{ atlas__user }}"

- name: Set up postgresql user
  postgresql_user:
    name: "{{ atlas__user }}"
  become_user: postgres

- name: Set up postgresql database
  postgresql_db:
    name: "{{ atlas__dbname }}"
    owner: "{{ atlas__user }}"
  become_user: postgres
  notify:
    - atlas flask db upgrade
    - restart atlas gunicorn

- name: Set up postgis extension on db {{ atlas__dbname }}
  postgresql_ext:
    name: postgis
    login_db: "{{ atlas__dbname }}"
  become_user: postgres
  notify:
    - atlas flask db upgrade
    - restart atlas gunicorn

- name: Set up virtualenv base
  pip:
    requirements: "{{ atlas__basedir }}/stop_sync_osm_atlas/requirements.txt"
    virtualenv: "{{ atlas__basedir }}/venv"
    virtualenv_python: python3.13
  become_user: "{{ atlas__user }}"

- name: Set up virtualenv matcher
  pip:
    name: "{{ atlas__basedir }}/osm-public-transport-matcher[swiss,acquisition]"
    virtualenv: "{{ atlas__basedir }}/venv"
    virtualenv_python: python3.13
    editable: true
    chdir: "{{ atlas__basedir }}/stop_sync_osm_atlas"
  become_user: "{{ atlas__user }}"

- name: gunicorn server
  systemd_service:
    name: atlas_gunicorn
    enabled: true
    state: started
    service:
      Unit:
        Description: Gunicorn instance for atlas stop comparison
      Service:
        Type: simple
        Environment: "PATH=\"{{ atlas__basedir }}/venv/bin:/usr/local/bin:/usr/bin:/bin\" DATABASE_URI=\"postgresql+psycopg://atlas@/atlas\" PIPELINE_SCHEDULE_INTERVAL_HOURS=2"
        ExecStart: "{{ atlas__basedir }}/venv/bin/gunicorn -w 2 -b localhost:{{ atlas__gunicorn_port }} --pythonpath \"{{ atlas__basedir }}/stop_sync_osm_atlas/\" backend.app:app"
        User: "{{ atlas__user }}"
        Group: "{{ atlas__user }}"
        WorkingDirectory: "{{ atlas__basedir }}/stop_sync_osm_atlas"
        ExecReload: "/bin/kill -s HUP $MAINPID"

# apache http server conf
- name: apache enable module
  apache_module:
    name: "{{ item }}"
  loop:
    - proxy_http
    - headers
    - md

- name: apache site for atlas
  apache_site:
    site: atlas
    src: atlas_site.apache.jinja
  notify: reload apache2


