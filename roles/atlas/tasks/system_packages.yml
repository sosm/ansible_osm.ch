- name: Install base system dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
      - python3-sqlalchemy
      - python3-psycopg
      - python3-geoalchemy2
      - python3-requests
      - python3-flask
      - python3-flask-sqlalchemy
      - redis
      - python3-redis

    state: present
    update_cache: true

- name: Install web-specific dependencies
  ansible.builtin.apt:
    name:
      - python3-cffi
      - libcairo2
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libgdk-pixbuf-2.0-0
      - libffi-dev
      - shared-mime-info
      - python3-flask-limiter
      - python3-flask-talisman
      - python3-flask-migrate
      - python3-werkzeug
      - python3-gunicorn
      - weasyprint
      - python3-mistune
      - python3-bleach
    state: present

- name: Install import and matching dependencies
  ansible.builtin.apt:
    name:
      - gdal-bin
      - libgdal-dev
      - libgeos-dev
      - libproj-dev
      - proj-data
      - proj-bin
      - libspatialindex-dev
      - libspatialindex8
      - build-essential
      - python3-pandas
      - python3-geopandas
      - python3-numpy
      - python3-scipy
      - python3-shapely
      - python3-apscheduler
    state: present

